apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
data:
  rabbitmq.conf: |
    ## AMQP listener (IoT Agent consumes from this)
    listeners.tcp.default = 5672

    ## MQTT listeners (only TLS for external devices, no internal TCP needed)
    mqtt.listeners.ssl.1 = 0.0.0.0:8883
    mqtt.allow_anonymous = false
    mqtt.ssl_cert_login = true
    mqtt.vhost            = /
    mqtt.exchange         = amq.topic

    ## Internal service account (Bento AMQP + IoT Agent AMQP)
    default_user = $(RABBITMQ_DEFAULT_USER)
    default_pass = $(RABBITMQ_DEFAULT_PASS)

    ## Cert-based MQTT auth: CN of client cert becomes the MQTT username.
    ## For internal services CN matches an internal user; for tenant devices
    ## CN equals the tenant CVR and goes through the HTTP auth backend.
    ssl_cert_login_from = common_name

    ## Auth backend chain: internal first (so iot_pipeline/bento/iot-agent
    ## authenticate via internal user db and never hit the HTTP backend),
    ## falling through to cache→http for tenant devices.
    auth_backends.1.authn = rabbit_auth_backend_internal
    auth_backends.1.authz = rabbit_auth_backend_internal
    auth_backends.2.authn = rabbit_auth_backend_cache
    auth_backends.2.authz = rabbit_auth_backend_cache

    auth_cache.cached_backend = rabbit_auth_backend_http
    auth_cache.cache_ttl      = 86400000

    auth_http.http_method   = post
    auth_http.user_path     = http://api:8081/auth/user
    auth_http.vhost_path    = http://api:8081/auth/vhost
    auth_http.resource_path = http://api:8081/auth/resource
    auth_http.topic_path    = http://api:8081/auth/topic

    ## TLS (for device-facing port 8883)
    ssl_options.cacertfile = /etc/rabbitmq/certs/ca.crt
    ssl_options.certfile   = /etc/rabbitmq/certs/server.crt
    ssl_options.keyfile    = /etc/rabbitmq/certs/server.key
    ssl_options.verify     = verify_peer
    ssl_options.fail_if_no_peer_cert = true

    log.file.level = debug
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_mqtt,rabbitmq_amqp1_0,rabbitmq_auth_backend_http,rabbitmq_auth_backend_cache].
