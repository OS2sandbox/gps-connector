apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          ports:
            - containerPort: 9000 # S3 API
            - containerPort: 9001 # Admin UI
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: gps-connector-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gps-connector-secrets
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - mountPath: /data
              name: data
          command: ["minio", "server", "/data", "--console-address", ":9001"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
