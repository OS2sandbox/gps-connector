apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
data:
  rabbitmq.conf: |
    ## AMQP listener (IoT Agent consumes from this)
    listeners.tcp.default = 5672

    ## MQTT listeners (only TLS for external devices, no internal TCP needed)
    mqtt.listeners.ssl.1 = 0.0.0.0:8883
    mqtt.allow_anonymous = true
    mqtt.vhost            = /
    mqtt.exchange         = amq.topic
    mqtt.default_user     = $(RABBITMQ_DEFAULT_USER)
    mqtt.default_pass     = $(RABBITMQ_DEFAULT_PASS)

    ## Internal service account (Bento AMQP + IoT Agent AMQP)
    default_user = $(RABBITMQ_DEFAULT_USER)
    default_pass = $(RABBITMQ_DEFAULT_PASS)

    ## TLS (for device-facing port 8883)
    ssl_options.cacertfile = /etc/rabbitmq/certs/ca.crt
    ssl_options.certfile   = /etc/rabbitmq/certs/server.crt
    ssl_options.keyfile    = /etc/rabbitmq/certs/server.key
    ssl_options.verify     = verify_peer
    ssl_options.fail_if_no_peer_cert = true

    log.file.level = debug
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_mqtt,rabbitmq_amqp1_0].