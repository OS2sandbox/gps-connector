apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.4.2
          ports:
            - containerPort: 3100
          volumeMounts:
            - mountPath: /etc/loki/loki.yaml
              name: config
              subPath: loki.yaml
            - mountPath: /loki
              name: loki-data
          args: ["-config.file=/etc/loki/loki.yaml"]

      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: loki-data
          persistentVolumeClaim:
            claimName: loki-data
