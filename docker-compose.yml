services:
  mongo:
    image: mongo:4.2
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  orion:
    image: fiware/orion-ld:latest
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "1026:1026"
    environment:
      ORIONLD_MULTI_SERVICE: "TRUE"
    command: ["-logLevel", "INFO", "-dbhost", "mongo"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:1026/version"]
      interval: 10s
      timeout: 5s
      retries: 5

  crate:
    image: crate:${CRATE_VERSION:-4.6.7}
    command: crate -Cauth.host_based.enabled=false
      -Ccluster.name=democluster -Chttp.cors.enabled=true -Chttp.cors.allow-origin="*"
    environment:
      - LOG4J_FORMAT_MSG_NO_LOOKUPS=true
    ports:
      # Admin UI
      - "4200:4200"
      # Transport protocol
      - "4300:4300"
    volumes:
      - cratedata:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4200/"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  quantumleap:
    image: orchestracities/quantumleap:${QL_VERSION:-latest}
    hostname: quantumleap
    ports:
      - "8668:8668"
    depends_on:
      crate:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - CRATE_HOST=crate
      - REDIS_HOST=redis
      - QL_DEFAULT_DB=crate

  iot-agent:
    image: fiware/iotagent-json:latest
    hostname: iot-agent
    depends_on:
      mongo:
        condition: service_healthy
      orion:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "14041:4041"   # North Port (Config API)
      - "7896:7896"   # South Port (Device Data)
    environment:
      - IOTA_CB_HOST=orion
      - IOTA_CB_PORT=1026
      - IOTA_NORTH_PORT=4041
      - IOTA_HTTP_PORT=7896
      - IOTA_REGISTRY_TYPE=mongodb
      - IOTA_MONGO_HOST=mongo
      - IOTA_MONGO_PORT=27017
      - IOTA_MONGO_DB=iotagent-json
      - IOTA_PROVIDER_URL=http://iot-agent:4041
      - IOTA_DEFAULT_RESOURCE=/iot/json
      - IOTA_LOG_LEVEL=DEBUG
      - IOTA_CB_NGSI_VERSION=ld
      - IOTA_JSON_LD_CONTEXT=https://uri.etsi.org/ngsi-ld/v1/ngsi-ld-core-context.jsonld
      - IOTA_FALLBACK_TENANT=default
      - IOTA_MULTI_CORE=false
      # Use AMQP (not MQTT) for IoT Agent → RabbitMQ.
      # RabbitMQ does not support MQTT $share/ subscriptions,
      # which iotagent-json:latest hardcodes. AMQP consumes from
      # the same amq.topic exchange that the MQTT plugin publishes to.
      - IOTA_MQTT_DISABLED=true
      - IOTA_AMQP_HOST=rabbitmq
      - IOTA_AMQP_PORT=5672
      - IOTA_AMQP_USERNAME=iot_pipeline
      - IOTA_AMQP_PASSWORD=changeme
      - IOTA_AMQP_EXCHANGE=amq.topic
      - IOTA_AMQP_DURABLE=true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4041/iot/about', r => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bento:
    image: ghcr.io/warpstreamlabs/bento:latest
    hostname: bento
    depends_on:
      rabbitmq:
        condition: service_healthy
      iot-agent:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./bento/config.yaml:/bento.yaml:ro
    restart: unless-stopped


  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    ports:
      # 8883 fjernet - Traefik håndterer ekstern TLS trafik
      - "15673:15672" # Management UI
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./mosq_certs:/etc/rabbitmq/certs:ro
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  traefik:
    image: traefik:v3.3
    hostname: traefik
    ports:
      - "8883:8883"   # MQTT TLS - device ingress
    volumes:
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    command:
      - --entrypoints.mqtt-tls.address=:8883
      - --providers.file.filename=/etc/traefik/dynamic.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodata:
  cratedata:
  redisdata:
  rabbitmqdata:
