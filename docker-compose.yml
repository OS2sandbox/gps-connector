services:
  mongo:
    image: mongo:4.2
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  orion:
    image: fiware/orion-ld:latest
    depends_on:
      - mongo
    ports:
      - "1026:1026"
    environment:
      ORIONLD_MULTI_SERVICE: "TRUE"
    command: ["-logLevel", "INFO", "-dbhost", "mongo"]

  crate:
    image: crate:${CRATE_VERSION:-4.6.7}
    command: crate -Cauth.host_based.enabled=false
      -Ccluster.name=democluster -Chttp.cors.enabled=true -Chttp.cors.allow-origin="*"
    environment:
      - LOG4J_FORMAT_MSG_NO_LOOKUPS=true
    ports:
      # Admin UI
      - "4200:4200"
      # Transport protocol
      - "4300:4300"
    volumes:
      - cratedata:/data

  redis:
    image: redis:6.2
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  quantumleap:
    image: orchestracities/quantumleap:${QL_VERSION:-latest}
    hostname: quantumleap
    ports:
      - "8668:8668"
    depends_on:
      - crate
      - redis
    environment:
      - CRATE_HOST=crate
      - REDIS_HOST=redis
      - QL_DEFAULT_DB=crate

  iot-agent:
    image: fiware/iotagent-json:latest
    hostname: iot-agent
    depends_on:
      mongo:
        condition: service_started
      orion:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "14041:4041"   # North Port (Config API)
      - "7896:7896"   # South Port (Device Data)
    environment:
      - IOTA_CB_HOST=orion
      - IOTA_CB_PORT=1026
      - IOTA_NORTH_PORT=4041
      - IOTA_HTTP_PORT=7896
      - IOTA_REGISTRY_TYPE=mongodb
      - IOTA_MONGO_HOST=mongo
      - IOTA_MONGO_PORT=27017
      - IOTA_MONGO_DB=iotagent-json
      - IOTA_PROVIDER_URL=http://iot-agent:4041
      - IOTA_DEFAULT_RESOURCE=/iot/json
      - IOTA_LOG_LEVEL=DEBUG
      - IOTA_CB_NGSI_VERSION=ld
      - IOTA_JSON_LD_CONTEXT=https://uri.etsi.org/ngsi-ld/v1/ngsi-ld-core-context.jsonld
      - IOTA_FALLBACK_TENANT=default
      - IOTA_MULTI_CORE=false
      # Use AMQP (not MQTT) for IoT Agent → RabbitMQ.
      # RabbitMQ does not support MQTT $share/ subscriptions,
      # which iotagent-json:latest hardcodes. AMQP consumes from
      # the same amq.topic exchange that the MQTT plugin publishes to.
      - IOTA_MQTT_DISABLED=true
      - IOTA_AMQP_HOST=rabbitmq
      - IOTA_AMQP_PORT=5672
      - IOTA_AMQP_USERNAME=iot_pipeline
      - IOTA_AMQP_PASSWORD=changeme
      - IOTA_AMQP_EXCHANGE=amq.topic
      - IOTA_AMQP_DURABLE=true
    restart: unless-stopped

  bento:
    image: ghcr.io/warpstreamlabs/bento:latest
    hostname: bento
    depends_on:
      rabbitmq:
        condition: service_healthy
      iot-agent:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./bento/config.yaml:/bento.yaml:ro
    restart: unless-stopped


  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    ports:
      # 8883 fjernet - NGINX håndterer nu ekstern TLS trafik
      - "15673:15672" # Management UI
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./mosq_certs:/etc/rabbitmq/certs:ro
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:latest
    hostname: nginx
    ports:
      - "8883:8883"   # MQTT TLS - devices rammer her i stedet
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodata:
  cratedata:
  redisdata:
  rabbitmqdata:
